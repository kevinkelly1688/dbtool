<!doctype html>
<html lang="zh-CN" data-skin="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据脱敏管理 · 原型 · dbtool</title>
<style>
/* ===== 皮肤变量：取自 web/static/css/app.css 的 --dt-*，与正式页面一致 ===== */
:root {
  --dt-bg: #060a11; --dt-panel: #0b121e; --dt-raise: #132036; --dt-line: #1a2a42; --dt-line-hi: #27405f;
  --dt-fg: #d6e2f0; --dt-muted: #7a8ca6; --dt-dim: #4f6079;
  --dt-cyan: #38e1ff; --dt-cyan-soft: rgba(56, 225, 255, .12);
  --dt-amber: #ffb547; --dt-amber-soft: rgba(255, 181, 71, .13);
  --dt-ok: #37d99a; --dt-ok-soft: rgba(55, 217, 154, .12);
  --dt-crit: #ff5577; --dt-crit-soft: rgba(255, 85, 119, .14);
  --dt-input: #0a111c; --dt-sunken: rgba(0, 0, 0, .2); --dt-on-accent: #04121a;
  --dt-shadow: 0 10px 30px rgba(0, 0, 0, .5);
}
:root[data-skin="light"] {
  --dt-bg: #f3f5f8; --dt-panel: #ffffff; --dt-raise: #eef2f7; --dt-line: #e3e8ef; --dt-line-hi: #cfd7e3;
  --dt-fg: #1d2735; --dt-muted: #5d6b7e; --dt-dim: #94a0b0;
  --dt-cyan: #1f6feb; --dt-cyan-soft: rgba(31, 111, 235, .09);
  --dt-amber: #b7700a; --dt-amber-soft: rgba(219, 140, 20, .12);
  --dt-ok: #1a8f5c; --dt-ok-soft: rgba(26, 143, 92, .1);
  --dt-crit: #cf2c46; --dt-crit-soft: rgba(207, 44, 70, .09);
  --dt-input: #f8fafc; --dt-sunken: #f5f7fa; --dt-on-accent: #ffffff; --dt-shadow: 0 10px 28px rgba(20, 35, 60, .12);
}
:root[data-skin="sepia"] {
  --dt-bg: #f1ead9; --dt-panel: #f8f2e3; --dt-raise: #ece3cf; --dt-line: #e2d7bf; --dt-line-hi: #d3c5a7;
  --dt-fg: #3b3428; --dt-muted: #7a6e59; --dt-dim: #a89b80;
  --dt-cyan: #2f7d6d; --dt-cyan-soft: rgba(47, 125, 109, .1);
  --dt-amber: #a66a12; --dt-amber-soft: rgba(166, 106, 18, .11);
  --dt-ok: #3f7d3a; --dt-ok-soft: rgba(63, 125, 58, .1);
  --dt-crit: #b2443a; --dt-crit-soft: rgba(178, 68, 58, .09);
  --dt-input: #fbf7ec; --dt-sunken: #f3ecda; --dt-on-accent: #fbf7ec; --dt-shadow: 0 10px 28px rgba(90, 70, 30, .14);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--dt-bg); color: var(--dt-fg); font: 13.5px/1.5 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: "JetBrains Mono", "Cascadia Code", Consolas, "Microsoft YaHei", monospace; }
.muted { color: var(--dt-muted); } .dim { color: var(--dt-dim); } .small { font-size: 12px; }

/* 顶栏（仅示意位置，正式页面用全局顶栏） */
.top { flex: none; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; background: var(--dt-panel); border-bottom: 1px solid var(--dt-line); }
.top .crumb { color: var(--dt-muted); } .top .crumb b { color: var(--dt-fg); }
.top .sp { flex: 1; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 1px solid var(--dt-line-hi); border-radius: 8px; background: var(--dt-panel); }
.seg button { height: 26px; padding: 0 11px; border: 0; border-radius: 6px; background: none; color: var(--dt-muted); }
.seg button[aria-pressed="true"], .seg button.on { background: var(--dt-cyan-soft); color: var(--dt-cyan); font-weight: 600; }

.page { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 20px 0; gap: 12px; overflow: hidden; }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 19px; }
.head .tag { font-size: 12px; color: var(--dt-muted); }
.btn { height: 30px; padding: 0 12px; border: 1px solid var(--dt-line-hi); border-radius: 5px; background: var(--dt-panel); }
.btn:hover { border-color: var(--dt-cyan); }
.btn.primary { background: var(--dt-cyan); border-color: var(--dt-cyan); color: var(--dt-on-accent); font-weight: 600; }
.btn.ghost { background: none; }
.btn.danger { color: var(--dt-crit); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.ipt, select.ipt { height: 30px; padding: 0 8px; border: 1px solid var(--dt-line-hi); border-radius: 4px; background: var(--dt-input); min-width: 0; }
.ipt:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--dt-cyan); outline-offset: 1px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--dt-line); flex: none; }
.tabs button { height: 34px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--dt-muted); }
.tabs button[aria-selected="true"] { color: var(--dt-cyan); border-bottom-color: var(--dt-cyan); font-weight: 600; }
.badge { display: inline-block; padding: 0 7px; font-size: 11.5px; line-height: 18px; border: 1px solid var(--dt-line-hi); border-radius: 9px; color: var(--dt-muted); white-space: nowrap; }
.badge.ok { color: var(--dt-ok); border-color: var(--dt-ok); background: var(--dt-ok-soft); }
.badge.warn { color: var(--dt-amber); border-color: var(--dt-amber); background: var(--dt-amber-soft); }
.badge.info { color: var(--dt-cyan); border-color: var(--dt-cyan); background: var(--dt-cyan-soft); }
.badge.crit { color: var(--dt-crit); border-color: var(--dt-crit); background: var(--dt-crit-soft); }

/* 工作台：左 选字段 | 右 选规则 */
.bench { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); gap: 12px; }
.panel { min-height: 0; display: flex; flex-direction: column; background: var(--dt-panel); border: 1px solid var(--dt-line); border-radius: 8px; }
.panel > h2 { margin: 0; padding: 10px 14px; font-size: 14px; border-bottom: 1px solid var(--dt-line); display: flex; align-items: center; gap: 8px; flex: none; }
.step { width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--dt-cyan-soft); color: var(--dt-cyan); font-size: 12px; font-weight: 700; }
.toolbar { flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--dt-line); }
.toolbar .grow { flex: 1; min-width: 140px; }
.chips { display: inline-flex; gap: 4px; }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--dt-line-hi); border-radius: 13px; background: none; color: var(--dt-muted); font-size: 12.5px; }
.chip[aria-pressed="true"] { color: var(--dt-cyan); border-color: var(--dt-cyan); background: var(--dt-cyan-soft); }
.scroll { flex: 1; min-height: 0; overflow: auto; }

/* 树 */
.tbl { border-bottom: 1px solid var(--dt-line); }
.tbl-row { display: flex; align-items: center; gap: 8px; padding: 7px 14px; }
.tbl-row:hover { background: var(--dt-cyan-soft); }
.tbl-row .caret { width: 18px; height: 18px; border: 0; background: none; color: var(--dt-muted); transition: transform .12s; }
.tbl.open > .tbl-row .caret { transform: rotate(90deg); }
.tbl-row .name { font-weight: 600; }
.tbl-row .cnt { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.db-head { position: sticky; top: 0; z-index: 1; padding: 6px 14px; background: var(--dt-raise); color: var(--dt-muted); font-size: 12px; letter-spacing: .04em; border-bottom: 1px solid var(--dt-line); }
.cols { display: none; background: var(--dt-sunken); }
.tbl.open > .cols { display: block; }
.col-row { display: grid; grid-template-columns: 22px minmax(120px, 1.1fr) 120px minmax(80px, 1fr) auto; align-items: center; gap: 8px; padding: 5px 14px 5px 40px; border-top: 1px solid var(--dt-line); }
.col-row:hover { background: var(--dt-cyan-soft); }
.col-row.sel { background: var(--dt-cyan-soft); }
.col-row .cm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--dt-cyan); }
.empty { padding: 36px 16px; text-align: center; color: var(--dt-muted); }

/* 右侧：规则 */
.rule-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 14px; }
.kinds { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kind { text-align: left; padding: 9px 11px; border: 1px solid var(--dt-line-hi); border-radius: 8px; background: none; }
.kind b { display: block; margin-bottom: 2px; }
.kind[aria-pressed="true"] { border-color: var(--dt-cyan); background: var(--dt-cyan-soft); }
.kind[aria-pressed="true"] b { color: var(--dt-cyan); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.num { display: inline-flex; align-items: center; border: 1px solid var(--dt-line-hi); border-radius: 5px; overflow: hidden; background: var(--dt-input); }
.num button { width: 28px; height: 30px; border: 0; background: none; font-size: 16px; }
.num button:hover { background: var(--dt-cyan-soft); }
.num input { width: 44px; height: 30px; border: 0; border-inline: 1px solid var(--dt-line-hi); background: none; text-align: center; }
.formula { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px dashed var(--dt-line-hi); border-radius: 8px; flex-wrap: wrap; }
.formula .mid { padding: 2px 10px; border-radius: 4px; background: var(--dt-raise); color: var(--dt-muted); letter-spacing: .1em; }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preview { border: 1px solid var(--dt-line); border-radius: 8px; overflow: hidden; }
.preview table { width: 100%; border-collapse: collapse; }
.preview th, .preview td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--dt-line); }
.preview th { color: var(--dt-muted); font-weight: 500; font-size: 12px; background: var(--dt-sunken); }
.preview tr:last-child td { border-bottom: 0; }
.preview td.out { color: var(--dt-cyan); }
.preview input { width: 100%; height: 26px; border: 1px solid var(--dt-line-hi); border-radius: 4px; background: var(--dt-input); padding: 0 6px; }
.impact { padding: 10px 12px; border-radius: 8px; background: var(--dt-sunken); border: 1px solid var(--dt-line); }
.impact ul { margin: 6px 0 0; padding-left: 18px; }
.impact li.warn { color: var(--dt-amber); }
label.radio { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; }
label.radio input { margin-top: 3px; }

/* 底部固定条 */
.bar { flex: none; margin: 0 -20px; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--dt-panel); border-top: 1px solid var(--dt-line); box-shadow: 0 -6px 18px rgba(0, 0, 0, .12); }
.bar .sum { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar .sp { flex: 1; }

/* 已配置 */
.cfg { flex: 1; min-height: 0; display: flex; flex-direction: column; }
table.list { width: 100%; border-collapse: collapse; }
table.list th, table.list td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--dt-line); vertical-align: middle; }
table.list th { position: sticky; top: 0; background: var(--dt-raise); color: var(--dt-muted); font-weight: 500; font-size: 12px; z-index: 1; }
table.list tr:hover td { background: var(--dt-cyan-soft); }
.switch { position: relative; width: 34px; height: 18px; border-radius: 9px; border: 1px solid var(--dt-line-hi); background: var(--dt-raise); padding: 0; }
.switch::after { content: ""; position: absolute; top: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%; background: var(--dt-muted); transition: left .12s; }
.switch[aria-checked="true"] { background: var(--dt-cyan-soft); border-color: var(--dt-cyan); }
.switch[aria-checked="true"]::after { left: 17px; background: var(--dt-cyan); }

/* 弹窗 / 抽屉 */
.mask { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .5); display: grid; place-items: center; padding: 20px; }
[hidden] { display: none !important; }
.dlg { width: min(720px, 100%); max-height: 86vh; display: flex; flex-direction: column; background: var(--dt-panel); border: 1px solid var(--dt-line-hi); border-radius: 10px; box-shadow: var(--dt-shadow); }
.dlg h3 { margin: 0; padding: 14px 18px; font-size: 16px; border-bottom: 1px solid var(--dt-line); }
.dlg .bd { padding: 14px 18px; overflow: auto; }
.dlg .ft { padding: 12px 18px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid var(--dt-line); }
.dlg textarea { width: 100%; min-height: 150px; padding: 8px; border: 1px solid var(--dt-line-hi); border-radius: 5px; background: var(--dt-input); }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: 8px; background: var(--dt-panel); border: 1px solid var(--dt-ok); color: var(--dt-ok); box-shadow: var(--dt-shadow); }
.toast[hidden] { display: none; }
.proto-note { flex: none; padding: 6px 12px; border: 1px dashed var(--dt-amber); border-radius: 6px; color: var(--dt-amber); background: var(--dt-amber-soft); font-size: 12px; }
/* 引擎标签条 */
.engine { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 8px 12px; border: 1px solid var(--dt-line); border-radius: 8px; background: var(--dt-panel); font-size: 12.5px; }
.engine .item { display: inline-flex; gap: 6px; align-items: baseline; }
.engine .k { color: var(--dt-muted); }
.addpath { flex: none; padding: 8px 14px; border-bottom: 1px solid var(--dt-line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; }
.addpath .ipt { flex: 1; min-width: 180px; }
@media (max-width: 1100px) { .bench { grid-template-columns: 1fr; overflow: auto; } .panel { min-height: 420px; } }
</style>
</head>
<body>
<div class="top">
  <span class="crumb">系统管理 / <b>数据脱敏</b></span>
  <span class="sp"></span>
  <div class="seg" role="group" aria-label="主题">
    <button type="button" data-skin="light" aria-pressed="false">明亮</button>
    <button type="button" data-skin="dark" aria-pressed="true">深空</button>
    <button type="button" data-skin="sepia" aria-pressed="false">护眼</button>
  </div>
</div>

<main class="page">
  <div class="head">
    <h1>数据脱敏</h1><span class="tag mono">menu_data_masking</span>
    <span style="flex:1"></span>
    <label class="muted small" for="inst">实例</label>
    <select id="inst" class="ipt" style="min-width:210px"></select>
    <button class="btn" id="b-paste" type="button">粘贴清单选字段</button>
  </div>
  <div class="engine" id="engine"></div>
  <div class="proto-note">原型 · 模拟数据，操作只改页面内存，刷新即还原</div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="t-wiz" aria-selected="true">配置向导</button>
    <button type="button" role="tab" id="t-cfg" aria-selected="false">已配置字段 <span class="badge" id="cfg-count">0</span></button>
  </div>

  <!-- ===== 配置向导 ===== -->
  <section id="wiz" class="bench">
    <div class="panel">
      <h2><span class="step">1</span>选择字段</h2>
      <div class="toolbar">
        <select id="db" class="ipt"></select>
        <input id="q" class="ipt grow" type="search" placeholder="筛选表 / 字段 / 注释" aria-label="筛选">
        <div class="seg" role="group" aria-label="视图">
          <button type="button" id="v-table" aria-pressed="true">按表</button>
          <button type="button" id="v-name" aria-pressed="false">按字段名</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="chips" role="group" aria-label="状态筛选">
          <button class="chip" data-f="all" aria-pressed="true" type="button">全部</button>
          <button class="chip" data-f="sus" aria-pressed="false" type="button">疑似敏感</button>
          <button class="chip" data-f="un" aria-pressed="false" type="button">未脱敏</button>
          <button class="chip" data-f="ok" aria-pressed="false" type="button">已脱敏</button>
        </div>
        <span style="flex:1"></span>
        <button class="btn ghost" id="b-sus" type="button">选中疑似敏感</button>
        <button class="btn ghost" id="b-all" type="button">全选当前结果</button>
        <button class="btn ghost" id="b-none" type="button">清空</button>
      </div>
      <div class="addpath" id="addpath" hidden>
        <span class="muted">补充字段路径</span>
        <input id="ap-in" class="ipt mono" placeholder="集合.字段路径" aria-label="手动添加字段路径">
        <button class="btn" id="ap-add" type="button">添加</button>
      </div>
      <div class="scroll" id="tree"></div>
    </div>

    <div class="panel">
      <h2><span class="step">2</span>选择脱敏方式</h2>
      <div class="scroll"><div class="rule-body">
        <div class="kinds" id="kinds" role="group" aria-label="规则类型"></div>
        <div id="params"></div>
        <div>
          <div class="muted small" style="margin-bottom:6px">常用预设</div>
          <div class="presets" id="presets"></div>
        </div>
        <div>
          <div class="muted small" style="margin-bottom:6px">试算</div>
          <div class="preview"><table id="prev"></table></div>
        </div>
        <div>
          <div class="muted small" style="margin-bottom:2px">生效范围</div>
          <label class="radio"><input type="radio" name="scope" value="exact" checked><span><b id="sc-exact">只对所选的“库.表.字段”</b></span></label>
          <label class="radio"><input type="radio" name="scope" value="name"><span><b id="sc-name">该实例所有表里的同名字段</b></span></label>
        </div>
        <div class="impact" id="impact"></div>
        <button class="btn primary" id="b-apply" type="button">应用到所选字段</button>
      </div></div>
    </div>
  </section>

  <!-- ===== 已配置字段 ===== -->
  <section id="cfgsec" class="cfg" hidden>
    <div class="panel" style="flex:1">
      <div class="toolbar">
        <input id="cq" class="ipt grow" type="search" placeholder="筛选 库.表.字段 / 规则" aria-label="筛选已配置">
        <select id="cf-rule" class="ipt"><option value="">全部规则</option></select>
        <select id="cf-state" class="ipt"><option value="">全部状态</option><option value="1">已启用</option><option value="0">已停用</option></select>
        <span style="flex:1"></span>
        <button class="btn" id="c-on" type="button">批量启用</button>
        <button class="btn" id="c-off" type="button">批量停用</button>
        <button class="btn" id="c-edit" type="button">用所选字段改规则</button>
        <button class="btn danger" id="c-del" type="button">批量移除</button>
      </div>
      <div class="scroll"><table class="list" id="ctable"></table></div>
    </div>
  </section>

  <div class="bar" id="bar"></div>
</main>

<!-- 粘贴清单 -->
<div class="mask" id="m-paste" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="paste-t">
    <h3 id="paste-t">粘贴清单选字段</h3>
    <div class="bd">
      <textarea id="paste" class="mono" placeholder="shop.users.phone&#10;orders.receiver_phone&#10;id_card"></textarea>
      <div id="paste-res" class="small muted" style="margin-top:8px"></div>
    </div>
    <div class="ft"><button class="btn" id="p-close" type="button">取消</button><button class="btn primary" id="p-ok" type="button">选中匹配到的字段</button></div>
  </div>
</div>

<!-- 保存前确认 -->
<div class="mask" id="m-save" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="save-t">
    <h3 id="save-t">确认保存脱敏配置</h3>
    <div class="bd" id="save-body"></div>
    <div class="ft"><button class="btn" id="s-cancel" type="button">再看看</button><button class="btn primary" id="s-ok" type="button">确认并生效</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  /* ------------------------------------------------------------------ 演示数据 */
  var C = function (n, t, c) { return { n: n, t: t, c: c || '' }; };
  var INSTANCES = [
    { id: 1, name: 'prod-mysql-01', eng: 'mysql', type: 'MySQL', dbs: [

  $('ctable').addEventListener('change', function (e) {
    var act = e.target.dataset.act;
    if (e.target.id === 'c-all') { var on = e.target.checked; $('ctable').querySelectorAll('tbody tr[data-k]').forEach(function (tr) { if (on) S.cfgSel[tr.dataset.k] = true; else delete S.cfgSel[tr.dataset.k]; }); renderCfg(); return; }
    if (act === 'ccsel') { var k = e.target.closest('tr').dataset.k; if (e.target.checked) S.cfgSel[k] = true; else delete S.cfgSel[k]; }
  });
  $('ctable').addEventListener('click', function (e) {
    if (e.target.dataset.act !== 'cswitch') return;
    var k = e.target.closest('tr').dataset.k, cf = CFG[S.inst.id][k]; cf.active = !cf.active; renderCfg(); toast(cf.active ? '已启用' : '已停用');
  });
  function cfgKeys() { return Object.keys(S.cfgSel); }
  $('c-on').addEventListener('click', function () { cfgKeys().forEach(function (k) { CFG[S.inst.id][k].active = true; }); renderCfg(); });
  $('c-off').addEventListener('click', function () { cfgKeys().forEach(function (k) { CFG[S.inst.id][k].active = false; }); renderCfg(); });
  $('c-del').addEventListener('click', function () {
    var ks = cfgKeys(); if (!ks.length) return;
    ks.forEach(function (k) { STAGED[S.inst.id][k] = { op: 'remove' }; }); S.cfgSel = {}; setTab('wiz'); refresh(); toast('已把 ' + ks.length + ' 项加入“待移除”，保存后生效');
  });
  $('c-edit').addEventListener('click', function () {
    var ks = cfgKeys().filter(function (k) { return k.indexOf('*.*.') !== 0; });
    if (!ks.length) { toast('请先勾选要改规则的字段（通配项请在向导里按字段名选）'); return; }
    S.sel = {}; ks.forEach(function (k) { S.sel[k] = true; }); S.filter = 'all'; setTab('wiz'); refresh(); toast('已把 ' + ks.length + ' 个字段带回向导，选好新规则后应用');
  });

  // 粘贴清单
  $('b-paste').addEventListener('click', function () { $('m-paste').hidden = false; $('paste').focus(); });
  $('p-close').addEventListener('click', function () { $('m-paste').hidden = true; });
  function parsePaste() {
    var lines = $('paste').value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean), hit = [], miss = [];
    var all = []; S.inst.dbs.forEach(function (d) { d.tables.forEach(function (t) { t.cols.forEach(function (c) { all.push({ k: colKey(d.name, t, c) }); }); }); });
    lines.forEach(function (l) {
      var tail = '.' + l.replace(/[`"']/g, '').toLowerCase();   // 与完整路径从右往左按点号边界匹配，表名带架构、Mongo 路径带点都一样处理
      var m = all.filter(function (x) { var k = '.' + x.k.toLowerCase(); return k.length >= tail.length && k.slice(k.length - tail.length) === tail; });
      if (m.length) m.forEach(function (x) { hit.push(x.k); }); else miss.push(l);
    });
    return { hit: hit, miss: miss, n: lines.length };
  }
  $('paste').addEventListener('input', function () {
    var r = parsePaste();
    $('paste-res').innerHTML = r.n ? '共 ' + r.n + ' 行，匹配到 <b>' + r.hit.length + '</b> 个字段' + (r.miss.length ? '；<span style="color:var(--dt-amber)">未匹配 ' + r.miss.length + ' 行：' + esc(r.miss.slice(0, 5).join('、')) + (r.miss.length > 5 ? '…' : '') + '</span>' : '') : '';
  });
  $('p-ok').addEventListener('click', function () {
    var r = parsePaste(); setSel(r.hit, true); $('m-paste').hidden = true; setTab('wiz'); refresh();
    toast('已选中 ' + r.hit.length + ' 个字段' + (r.miss.length ? '，' + r.miss.length + ' 行没匹配到' : ''));
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { $('m-paste').hidden = true; $('m-save').hidden = true; } });

  // 引擎标签条
  function renderEngine() {
    var e = ENG(S.inst), cls = { exact: 'ok', name: 'warn', path: 'info' }[e.acc], txt = { exact: '精确定位', name: '保守匹配', path: '字段路径匹配' }[e.acc];
    $('engine').innerHTML = '<span class="badge info">' + esc(e.label) + '</span>' +
      '<span class="item"><span class="k">结果列定位</span><span class="badge ' + cls + '">' + txt + '</span></span>';
  }
  function applyUnits() {
    var e = ENG(S.inst);
    $('v-table').textContent = '按' + e.tbl;
    $('q').placeholder = '筛选' + e.tbl + ' / ' + e.col + ' / 注释';
    $('sc-exact').textContent = '只对所选的“' + e.path + '”';
    $('sc-name').textContent = '该实例所有' + e.tbl + '里的同名' + e.col;
    $('addpath').hidden = S.inst.eng !== 'mongo';
  }
  $('ap-add').addEventListener('click', function () {
    var v = $('ap-in').value.trim(), i = v.indexOf('.');
    if (i < 1 || i === v.length - 1) { toast('格式：集合.字段路径，例如 users.profile.wechat'); return; }
    var coll = v.slice(0, i), path = v.slice(i + 1), dbn = S.db || S.inst.dbs[0].name;
    var d = S.inst.dbs.filter(function (x) { return x.name === dbn; })[0];
    var t = d.tables.filter(function (x) { return x.name === coll; })[0];
    if (!t) { t = { name: coll, comment: '（手动添加）', rows: 0, cols: [] }; d.tables.push(t); }
    if (t.cols.some(function (c) { return c.n === path; })) { toast('该路径已存在'); return; }
    t.cols.push(C(path, 'string', '手动添加'));
    S.open[dbn + '|' + coll] = true; S.sel[colKey(dbn, t, { n: path })] = true; $('ap-in').value = '';
    refresh(); toast('已添加 ' + dbn + '.' + coll + '.' + path + ' 并选中');
  });

  // 主题
  document.querySelectorAll('[data-skin]').forEach(function (b) { b.addEventListener('click', function () {
    document.documentElement.setAttribute('data-skin', b.dataset.skin);
    document.querySelectorAll('[data-skin]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  }); });

  /* ------------------------------------------------------------------ 初始化 */
  function fillDb() {
    $('db').innerHTML = '<option value="">全部库（' + S.inst.dbs.length + '）</option>' + S.inst.dbs.map(function (d) { return '<option value="' + esc(d.name) + '">' + esc(d.name) + '</option>'; }).join('');
    $('db').value = S.db;
  }
  $('inst').innerHTML = INSTANCES.map(function (i) { return '<option value="' + i.id + '">' + esc(i.name) + '（' + i.type + '）</option>'; }).join('') +
    UNSUPPORTED.map(function (u) { return '<option disabled>' + esc(u.name) + '（' + u.type + '）— 不在脱敏范围</option>'; }).join('');
  $('cf-rule').innerHTML += Object.keys(KIND_META).map(function (k) { return '<option value="' + k + '">' + KIND_META[k][0] + '</option>'; }).join('');
  fillDb(); renderEngine(); applyUnits(); renderRule(); refresh();
})();
</script>
</body>
</html>
