* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--dt-bg); color: var(--dt-fg); font: 13.5px/1.5 "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }

.muted { color: var(--dt-muted); } .dim { color: var(--dt-dim); } .small { font-size: 12px; }
[hidden] { display: none !important; }

/* 顶栏（仅示意位置，正式页面用全局顶栏） */
.top { flex: none; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 20px; background: var(--dt-panel); border-bottom: 1px solid var(--dt-line); }

.seg button[aria-pressed="true"] { background: var(--dt-cyan-soft); color: var(--dt-cyan); font-weight: 600; }

.page { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 20px 16px; gap: 12px; overflow: auto; }
.head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 19px; }
.btn { height: 30px; padding: 0 12px; border: 1px solid var(--dt-line-hi); border-radius: 5px; background: var(--dt-panel); white-space: nowrap; }
.btn:hover { border-color: var(--dt-cyan); }
.btn.primary { background: var(--dt-cyan); border-color: var(--dt-cyan); color: var(--dt-on-accent); font-weight: 600; }
.btn.ghost { background: none; }
.btn.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.btn.danger { color: var(--dt-crit); }

.link:hover { text-decoration: underline; }
.link.danger { color: var(--dt-crit); }

.ipt:focus, button:focus-visible, select:focus-visible { outline: 2px solid var(--dt-cyan); outline-offset: 1px; }
input[type=checkbox], input[type=radio] { width: 15px; height: 15px; accent-color: var(--dt-cyan); }

.tabs button { height: 36px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--dt-muted); }
.tabs button[aria-selected="true"] { color: var(--dt-cyan); border-bottom-color: var(--dt-cyan); font-weight: 600; }

.badge { display: inline-block; padding: 0 7px; font-size: 11.5px; line-height: 18px; border: 1px solid var(--dt-line-hi); border-radius: 9px; color: var(--dt-muted); white-space: nowrap; }

.badge.warn { color: var(--dt-amber); border-color: var(--dt-amber); background: var(--dt-amber-soft); }
.badge.info { color: var(--dt-cyan); border-color: var(--dt-cyan); background: var(--dt-cyan-soft); }
.badge.crit { color: var(--dt-crit); border-color: var(--dt-crit); background: var(--dt-crit-soft); }
.alert { padding: 8px 12px; border-radius: 6px; border: 1px solid; }
.alert.warn { background: var(--dt-amber-soft); border-color: var(--dt-amber); color: var(--dt-amber); }
.alert.info { background: var(--dt-cyan-soft); border-color: var(--dt-cyan); color: var(--dt-cyan); }

/* 概览 */
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 10px 14px; background: var(--dt-panel); border: 1px solid var(--dt-line); border-radius: 8px; }
.stat .k { color: var(--dt-muted); font-size: 12px; }
.stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .d { font-size: 12px; color: var(--dt-muted); }
.stat.crit .v { color: var(--dt-crit); } .stat.warn .v { color: var(--dt-amber); } .stat.ok .v { color: var(--dt-ok); }

/* 表格 */
.panel { background: var(--dt-panel); border: 1px solid var(--dt-line); border-radius: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--dt-line); }
.toolbar .grow { flex: 1; min-width: 160px; }
table.list { width: 100%; border-collapse: collapse; }
table.list th { text-align: left; padding: 8px 12px; font-weight: 600; font-size: 12.5px; color: var(--dt-muted); background: var(--dt-raise); border-bottom: 1px solid var(--dt-line); white-space: nowrap; }
table.list td { padding: 9px 12px; border-bottom: 1px solid var(--dt-line); vertical-align: top; }
table.list tr:hover td { background: var(--dt-cyan-soft); }
table.list tr.off td { opacity: .55; }
.rname { font-weight: 600; }
.cond { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.cond span { padding: 0 6px; font-size: 11.5px; line-height: 18px; border-radius: 4px; background: var(--dt-raise); color: var(--dt-muted); }
.cond span.k { color: var(--dt-code-kw); }
.cond span.j { background: none; color: var(--dt-dim); padding: 0 1px; }
.seg.mode button[data-m="enforce"][aria-pressed="true"] { background: var(--dt-ok-soft); color: var(--dt-ok); }
.sp7 { display: inline-flex; align-items: flex-end; gap: 2px; height: 20px; margin-left: 8px; vertical-align: middle; }
.sp7 i { width: 4px; background: var(--dt-cyan); opacity: .7; border-radius: 1px; min-height: 2px; }
.sw { position: relative; display: inline-block; width: 34px; height: 18px; }
.sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.sw b { position: absolute; inset: 0; border-radius: 9px; background: var(--dt-line-hi); transition: background .12s; pointer-events: none; }
.sw b::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--dt-fg); opacity: .85; transition: transform .12s; }
.sw input:checked + b { background: var(--dt-ok); }
.sw input:checked + b::after { transform: translateX(16px); background: #fff; opacity: 1; }
.empty { padding: 36px 16px; text-align: center; color: var(--dt-muted); }

/* SQL 展示 */
pre.sql { margin: 0; padding: 10px 12px; border: 1px solid var(--dt-line); border-radius: 6px; background: var(--dt-sunken); font: 12.5px/1.6 "JetBrains Mono", "Cascadia Code", Consolas, "Microsoft YaHei", monospace; white-space: pre-wrap; word-break: break-all; }
.sqlc { font: 12px "JetBrains Mono", Consolas, "Microsoft YaHei", monospace; color: var(--dt-fg); max-width: 520px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
mark { background: var(--dt-crit-soft); color: var(--dt-crit); border-radius: 2px; padding: 0 1px; outline: 1px solid var(--dt-crit); }

/* 抽屉 / 弹窗 */
.mask { position: fixed; inset: 0; z-index: 30; background: rgba(0, 0, 0, .45); display: flex; justify-content: flex-end; }
.drawer { width: min(640px, 100%); height: 100%; display: flex; flex-direction: column; background: var(--dt-panel); border-left: 1px solid var(--dt-line-hi); box-shadow: var(--dt-shadow); }
.drawer > h3 { margin: 0; padding: 14px 18px; font-size: 16px; border-bottom: 1px solid var(--dt-line); display: flex; align-items: center; gap: 10px; }
.drawer .bd { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 16px; }
.drawer .ft { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--dt-line); }
.sec > h4 { margin: 0 0 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; }
.sec > h4 .step { width: 20px; height: 20px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--dt-cyan-soft); color: var(--dt-cyan); font-size: 12px; font-weight: 700; }
.fgrid { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.fgrid > label { color: var(--dt-muted); font-size: 12.5px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks label { display: inline-flex; align-items: center; gap: 5px; }
.crow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 28px; gap: 8px; align-items: start; padding: 8px; border: 1px solid var(--dt-line); border-radius: 6px; background: var(--dt-sunken); }
.crow + .crow { margin-top: 6px; }
.joiner { margin: 6px 0; font-size: 12px; color: var(--dt-muted); }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.act { text-align: left; padding: 8px 10px; border: 1px solid var(--dt-line-hi); border-radius: 8px; background: none; }
.act b { display: block; }
.act[aria-pressed="true"] { border-color: var(--dt-cyan); background: var(--dt-cyan-soft); }
.act[aria-pressed="true"] b { color: var(--dt-cyan); }
.act.crit[aria-pressed="true"] { border-color: var(--dt-crit); background: var(--dt-crit-soft); } .act.crit[aria-pressed="true"] b { color: var(--dt-crit); }
.act.warn[aria-pressed="true"] { border-color: var(--dt-amber); background: var(--dt-amber-soft); } .act.warn[aria-pressed="true"] b { color: var(--dt-amber); }
.replay { border: 1px dashed var(--dt-line-hi); border-radius: 8px; padding: 10px 12px; }
.replay ul { margin: 6px 0 0; padding-left: 18px; }

/* 测试台 */
.bench { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.bench .panel { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.verdict { padding: 12px 14px; border-radius: 8px; border: 1px solid; display: flex; align-items: center; gap: 12px; }
.verdict .big { font-size: 20px; font-weight: 700; flex: none; white-space: nowrap; }
.verdict.deny { background: var(--dt-crit-soft); border-color: var(--dt-crit); color: var(--dt-crit); }
.verdict.pass { background: var(--dt-ok-soft); border-color: var(--dt-ok); color: var(--dt-ok); }
.verdict.mid { background: var(--dt-amber-soft); border-color: var(--dt-amber); color: var(--dt-amber); }
.hit { padding: 8px 10px; border: 1px solid var(--dt-line); border-radius: 6px; }
.hit + .hit { margin-top: 6px; }
.hit .why { margin-top: 4px; color: var(--dt-muted); font-size: 12.5px; }

/* 模板 */
.tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; padding: 12px 14px; }
.tpl { border: 1px solid var(--dt-line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--dt-panel); }
.tpl h5 { margin: 0; font-size: 13.5px; }
.tpl .cat { font-size: 11.5px; color: var(--dt-muted); letter-spacing: .06em; }
.tpl p { margin: 0; color: var(--dt-muted); font-size: 12.5px; flex: 1; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 50; padding: 8px 16px; border-radius: 8px; background: var(--dt-raise); border: 1px solid var(--dt-line-hi); box-shadow: var(--dt-shadow); }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, 1fr); } .bench { grid-template-columns: 1fr; } }

    var words = []; a.hits.forEach(function (x) { x.why.forEach(function (w) { words.push(w.hl); }); });
    var m = $('#mask'); m.hidden = false;
    m.innerHTML = '<div class="drawer" role="dialog" aria-modal="true"><h3>命中详情' + (h.eff === 'observe' ? '<span class="badge warn">观察命中</span>' : actionBadge(h.eff)) + '</h3><div class="bd">' +
      '<div class="fgrid"><label>时间</label><div>' + h.time + '</div><label>用户</label><div>' + esc(h.user) + '（' + h.group + '）</div><label>实例 / 库</label><div>' + esc(h.inst) + ' / ' + esc(h.db) + '</div><label>场景</label><div>' + SCENES[h.scene] + '</div><label>规则</label><div>' + esc(r ? r.name : '—') + '</div><label>指纹</label><div><code>' + fingerprint(h.sql).id + '</code></div></div>' +
      '<div><div class="muted small" style="margin-bottom:4px">语句</div><pre class="sql">' + highlight(h.sql, words) + '</pre></div>' +
      '<div class="alert info">' + (h.eff === 'observe' ? '规则处于观察模式：这条语句<b>已正常执行</b>，只留下这条记录。若规则已生效，将被' + (r ? ACTIONS[r.action].t : '处理') + '。' : '这条语句没有执行。用户看到的说明：' + esc(r ? r.msg : '')) + '</div>' +
      '</div><div class="ft"><button class="btn" type="button" data-act="exc-new" data-hit="' + h.id + '">为该用户添加例外…</button><button class="btn" type="button" data-act="close">关闭</button></div></div>';
  }
  function renderExc() {
    $('#p-exc').innerHTML = '<div class="panel"><div class="toolbar"><span style="flex:1"></span><button class="btn primary" type="button" data-act="exc-new">添加例外</button></div>' +
      '<table class="list"><thead><tr><th>规则</th><th>豁免对象</th><th>原因</th><th>有效期至</th><th>创建人</th><th style="width:70px"></th></tr></thead><tbody>' +
      S.exc.map(function (e) { var r = ruleById(e.rule); return '<tr><td>' + esc(r ? r.name : '—') + '</td><td>' + esc(e.who) + '</td><td>' + esc(e.why) + '</td><td>' + esc(e.until) + '</td><td>' + esc(e.by) + '</td><td><button class="link danger" data-act="exc-del" data-id="' + e.id + '">撤销</button></td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function renderTpl() {
    $('#p-tpl').innerHTML = '<div class="panel"><div class="tpls">' +
      TEMPLATES.map(function (t, i) {
        return '<div class="tpl"><span class="cat">' + t.cat + '</span><h5>' + esc(t.name) + '</h5><p>' + esc(t.desc) + '</p><div class="cond">' + t.rule.conds.map(condText).join('') + '</div>' +
          '<div style="display:flex;align-items:center;gap:8px">' + actionBadge(t.rule.action, t.rule.arg) + '<span style="flex:1"></span><button class="btn sm" type="button" data-act="tpl" data-i="' + i + '">添加（观察模式）</button></div></div>';
      }).join('') + '</div></div>';
  }
  function excDialog(hit) {
    var m = $('#mask'); m.hidden = false;
    var h = hit ? S.hits.filter(function (x) { return x.id === hit; })[0] : null;
    m.innerHTML = '<div class="drawer" style="width:min(520px,100%)" role="dialog" aria-modal="true"><h3>添加例外</h3><div class="bd"><div class="fgrid">' +
      '<label>规则</label><select class="ipt" id="x-rule">' + S.rules.map(function (r) { return '<option value="' + r.id + '"' + (h && h.rule === r.id ? ' selected' : '') + '>' + esc(r.name) + '</option>'; }).join('') + '</select>' +
      '<label>豁免对象</label><select class="ipt" id="x-who"><option>' + (h ? '用户 ' + esc(h.user) : '用户 …') + '</option><option>权限组 …</option><option>实例 …</option><option>SQL 指纹 …</option></select>' +
      '<label>有效期</label><select class="ipt" id="x-until"><option>7 天</option><option>30 天</option><option>90 天</option><option>长期</option></select>' +
      '<label>原因</label><textarea class="ipt" id="x-why" rows="3" placeholder="原因（必填）"></textarea></div></div>' +
      '<div class="ft"><button class="btn ghost" type="button" data-act="close">取消</button><button class="btn primary" type="button" data-act="exc-save">保存</button></div></div>';
  }

  // ===================== 事件 =====================
  function closeMask() { $('#mask').hidden = true; $('#mask').innerHTML = ''; S.draft = null; }
  function render() { renderHead(); renderTabs(); renderRules(); renderBench(); renderHits(); renderExc(); renderTpl(); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-t],[data-m],[data-s]');
    if (!el) { if (e.target.id === 'mask') closeMask(); return; }
    var act = el.dataset.act, d = S.draft, tr = el.closest('tr'), id = tr && Number(tr.dataset.id);
    if (el.dataset.t && el.parentNode.id === 'tabs') { S.tab = el.dataset.t; renderTabs(); return; }
    if (el.parentNode.id === 'gmode') { S.gmode = el.dataset.m; render(); toast(S.gmode === 'observe' ? '已切到全局观察模式：只记录，不拦截' : '已切到拦截模式'); return; }
    if (el.parentNode.id === 'skins') { document.documentElement.dataset.skin = el.dataset.s; renderHead(); return; }
    switch (act) {
      case 'edit': openEditor(ruleById(id)); break;
      case 'replay': openEditor(ruleById(id)); $('#replay').innerHTML = backtestHtml(S.draft); break;
      case 'del': if (confirm('删除这条规则？已有的命中记录会保留。')) { S.rules = S.rules.filter(function (r) { return r.id !== id; }); render(); toast('已删除'); } break;
      case 'close': closeMask(); break;
      case 'mode': d.mode = el.dataset.m; renderEditor(); break;
      case 'match': d.match = el.dataset.m; renderEditor(); break;
      case 'action': d.action = el.dataset.a; renderEditor(); break;
      case 'addcond': d.conds.push({ t: 'keyword', v: [] }); renderEditor(); break;
      case 'rmcond': d.conds.splice(Number(el.dataset.i), 1); renderEditor(); break;
      case 'backtest': $('#replay').innerHTML = backtestHtml(d); break;
      case 'save':
        if (!d.name.trim()) { toast('请填写规则名称'); return; }
        if (!d.conds.length) { toast('至少要有一个命中条件'); return; }
        if (!d.scenes.length) { toast('至少选择一个适用场景'); return; }
        delete d.__new;
        if (!d.id) { d.id = ++seq; S.rules.push(d); } else S.rules = S.rules.map(function (r) { return r.id === d.id ? d : r; });
        closeMask(); render(); toast('规则已保存' + (d.mode === 'observe' ? '（观察模式，不会拦截）' : '，立即生效'));
        break;
      case 'hit': renderHitDetail(S.hits.filter(function (h) { return h.id === Number(tr.dataset.hit); })[0]); break;
      case 'exc-new': excDialog(Number(el.dataset.hit) || 0); break;
      case 'exc-save': if (!$('#x-why').value.trim()) { toast('请填写原因'); return; } S.exc.unshift({ id: ++seq, rule: Number($('#x-rule').value), who: $('#x-who').value, why: $('#x-why').value, until: $('#x-until').value, by: 'admin' }); closeMask(); render(); toast('例外已添加'); break;
      case 'exc-del': S.exc = S.exc.filter(function (x) { return x.id !== Number(el.dataset.id); }); render(); toast('已撤销例外'); break;
      case 'tpl':
        var t = TEMPLATES[Number(el.dataset.i)], nr = Object.assign(blankRule(), JSON.parse(JSON.stringify(t.rule)), { name: t.name, desc: t.desc, id: ++seq, mode: 'observe', observeDays: 0, gmode: 'all', groups: [] });
        S.rules.push(nr); render(); toast('已添加「' + t.name + '」（观察模式）'); S.tab = 'rules'; renderTabs();
        break;
      case 'fp-bl': toast('已为指纹 ' + el.dataset.fp + ' 创建黑名单规则草稿（观察模式）'); break;
      case 'fp-wl': excDialog(0); break;
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, d = S.draft;
    if (el.id === 'b-pre') { var p = PRESETS[Number(el.value)]; if (p) { S.bench = Object.assign(S.bench, { sql: p[1], scene: p[2], env: p[3], group: p[4], hour: p[5], scan: p[6], affect: p[7], res: null }); renderBench(); runBench(); } return; }
    if (el.id === 'f-a') S.f.action = el.value; else if (el.id === 'f-s') S.f.scene = el.value; else if (el.id === 'f-st') S.f.state = el.value;
    if (el.id && el.id.indexOf('f-') === 0) { renderRules(); return; }
    if (!d || !el.dataset.f) return;
    var f = el.dataset.f, i = Number(el.dataset.i);
    if (f === 'scene') d.scenes = [].slice.call(document.querySelectorAll('[data-f=scene]:checked')).map(function (x) { return x.value; });
    else if (f === 'group') d.groups = [].slice.call(document.querySelectorAll('[data-f=group]:checked')).map(function (x) { return x.value; });
    else if (f === 'gmode') { d.gmode = el.value; renderEditor(); }
    else if (f === 'env') d.env = el.value;
    else if (f === 't') { var def = { stmt: ['SELECT'], feature: 'no_where', keyword: [], regex: '', object: [], scan_rows: 1000000, affect_rows: 100000, time: 'offhours', fingerprint: '' }; d.conds[i] = { t: el.value, v: def[el.value] }; renderEditor(); }
    else if (f === 'stmt') d.conds[i].v = [].slice.call(document.querySelectorAll('[data-f=stmt][data-i="' + i + '"]:checked')).map(function (x) { return x.value; });
    else if (f === 'v') d.conds[i].v = el.value;
    else if (f === 'num') d.conds[i].v = Number(el.value) || 0;
    else if (f === 'list') d.conds[i].v = el.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean);
    else if (f === 'prio' || f === 'arg') d[f] = Number(el.value) || 0;
    else d[f] = el.value;
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'f-q') { S.f.q = e.target.value; var pos = e.target.selectionStart; renderRules(); var q = $('#f-q'); q.focus(); q.setSelectionRange(pos, pos); }
  });
  $('#b-test').addEventListener('click', function () { S.tab = 'bench'; renderTabs(); });
  $('#b-new').addEventListener('click', function () { openEditor(null); });
  document.addEventListener('click', function (e) { if (e.target.id === 'b-run') runBench(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#mask').hidden) closeMask(); });

  // ===================== 启动（?skin= ?tab= ?edit= ?hit= ?mode=observe 方便截图）=====================
  document.documentElement.dataset.skin = Q.get('skin') || 'dark';
  if (Q.get('mode')) S.gmode = Q.get('mode');
  S.tab = Q.get('tab') || 'rules';
  render();
  if (S.tab === 'bench' || Q.get('run')) { var pi = Number(Q.get('run') || 0); var p0 = PRESETS[pi]; S.bench = Object.assign(S.bench, { sql: p0[1], scene: p0[2], env: p0[3], group: p0[4], hour: p0[5], scan: p0[6], affect: p0[7] }); renderBench(); runBench(); }
  if (Q.get('edit')) {
    openEditor(ruleById(Number(Q.get('edit'))));
    if (Q.get('backtest')) $('#replay').innerHTML = backtestHtml(S.draft);
    if (Q.get('scroll')) $('.drawer .bd').scrollTop = 1e6; // 截图用：滚到抽屉底部看“历史回放”
  }
  if (Q.get('hit')) renderHitDetail(S.hits.filter(function (h) { return h.id === Number(Q.get('hit')); })[0]);
})();
</script>
</body>
</html>
